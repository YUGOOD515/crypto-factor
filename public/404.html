<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<script>(function(){var t;try{t=localStorage.getItem('cf-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;if(t==='dark')document.querySelector('meta[name="theme-color"]').setAttribute('content','#181817')})()</script>
<title>Page not found · Crypto Factor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Same theme rule and colours as the site (index.html, src/styles/tokens.css). */
  :root { color-scheme: light; --bg: #fff; --fg: #111; --fg-2: #5c5c5c; --accent: #e1251b; }
  :root[data-theme='dark'] { color-scheme: dark; --bg: #181817; --fg: #f3f2ee; --fg-2: #a3a3a3; --accent: #f0412f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { color-scheme: dark; --bg: #181817; --fg: #f3f2ee; --fg-2: #a3a3a3; --accent: #f0412f; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 400 16px/1.5 Inter, "Helvetica Neue", Arial, sans-serif; }
  main { width: min(640px, calc(100% - 48px)); }
  p.k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); margin: 0 0 16px; }
  h1 { font-size: clamp(48px, 10vw, 90px); line-height: .95; letter-spacing: -.04em; margin: 0 0 24px; font-weight: 800; }
  a { color: var(--fg); font-weight: 600; text-underline-offset: 4px; }
  i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: -1px; }
</style>
</head>
<body>
<main>
  <p class="k"><i></i>Error 404</p>
  <h1>Nothing at this address.</h1>
  <p><a href="/">Back to Crypto Factor</a></p>
</main>
</body>
</html>
